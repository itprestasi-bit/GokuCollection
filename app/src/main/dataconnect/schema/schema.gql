# Data Connect Schema for GokuCollection (CollectionFieldApp)

type User @table(key: "uid") {
  uid: String!
  employeeCode: String! @unique
  name: String!
  role: String!
  branchId: String
}

type Outlet @table(key: "id") {
  id: String!
  code: String! @unique
  name: String!
  lat: Float!
  lng: Float!
  address: String!
  priority: Int! @default(value: 1)
  status: String! @default(value: "ACTIVE")
}

type Shift @table(key: "id") {
  id: String!
  user: User!
  collectorId: String!
  startedAt: Timestamp!
  endedAt: Timestamp
  status: String!
  firstLat: Float
  firstLng: Float
  lastLat: Float
  lastLng: Float
}

type TelemetryPoint @table(key: "id") {
  id: String!
  shift: Shift!
  collectorUid: String!
  collectorId: String!
  lat: Float!
  lng: Float!
  accuracyM: Float!
  speedMps: Float!
  bearing: Float!
  capturedAt: Timestamp!
  batteryPct: Int!
  networkState: String!
  mockFlag: Boolean! @default(value: false)
}

type Visit @table(key: "id") {
  id: String!
  shift: Shift!
  user: User!
  outlet: Outlet!
  arrivalAt: Timestamp!
  departureAt: Timestamp
  durationSec: Int
  result: String
  method: String! @default(value: "MANUAL")
  notes: String
}
