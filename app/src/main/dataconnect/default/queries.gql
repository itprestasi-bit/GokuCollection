# Queries and Mutations for GokuCollection

# --- Queries ---

query GetUser($uid: String!) @auth(level: USER) {
  user(key: { uid: $uid }) {
    uid
    employeeCode
    name
    role
    branchId
  }
}

query ListUsers @auth(level: USER) {
  users {
    uid
    employeeCode
  }
}

query ListActiveOutlets @auth(level: PUBLIC) {
  outlets(where: { status: { eq: "ACTIVE" } }) {
    id
    code
    name
    lat
    lng
    address
    priority
  }
}

query GetShiftHistory($uid: String!, $limit: Int = 10) @auth(level: USER) {
  shifts(where: { user: { uid: { eq: $uid } } }, orderBy: [{ startedAt: DESC }], limit: $limit) {
    id
    startedAt
    endedAt
    status
  }
}

# --- Mutations ---

mutation UpsertUser($uid: String!, $employeeCode: String!, $name: String!, $role: String!, $branchId: String) @auth(level: USER) {
  user_upsert(data: {
    uid: $uid,
    employeeCode: $employeeCode,
    name: $name,
    role: $role,
    branchId: $branchId
  })
}

mutation UpsertOutlet(
  $id: String!,
  $code: String!,
  $name: String!,
  $lat: Float!,
  $lng: Float!,
  $address: String!,
  $priority: Int!,
  $status: String!
) @auth(level: USER) {
  outlet_upsert(data: {
    id: $id,
    code: $code,
    name: $name,
    lat: $lat,
    lng: $lng,
    address: $address,
    priority: $priority,
    status: $status
  })
}

mutation CreateShift($id: String!, $uid: String!, $collectorId: String!, $startedAt: Timestamp!, $status: String!) @auth(level: USER) {
  shift_insert(data: {
    id: $id,
    userUid: $uid,
    collectorId: $collectorId,
    startedAt: $startedAt,
    status: $status
  })
}

mutation EndShift($id: String!, $endedAt: Timestamp!, $lastLat: Float, $lastLng: Float) @auth(level: USER) {
  shift_update(key: { id: $id }, data: {
    endedAt: $endedAt,
    status: "ENDED",
    lastLat: $lastLat,
    lastLng: $lastLng
  })
}

# SDK Kotlin belum dukung _Data input type secara langsung di parameter.
# Kita pake single insert & loop di Kotlin buat sinkronisasi telemetry.
mutation InsertTelemetry(
  $id: String!,
  $shiftId: String!,
  $collectorUid: String!,
  $collectorId: String!,
  $lat: Float!,
  $lng: Float!,
  $accuracyM: Float!,
  $speedMps: Float!,
  $bearing: Float!,
  $capturedAt: Timestamp!,
  $batteryPct: Int!,
  $networkState: String!,
  $mockFlag: Boolean!
) @auth(level: USER) {
  telemetryPoint_insert(data: {
    id: $id,
    shiftId: $shiftId,
    collectorUid: $collectorUid,
    collectorId: $collectorId,
    lat: $lat,
    lng: $lng,
    accuracyM: $accuracyM,
    speedMps: $speedMps,
    bearing: $bearing,
    capturedAt: $capturedAt,
    batteryPct: $batteryPct,
    networkState: $networkState,
    mockFlag: $mockFlag
  })
}

mutation RecordVisit(
  $id: String!,
  $shiftId: String!,
  $userUid: String!,
  $outletId: String!,
  $arrivalAt: Timestamp!,
  $departureAt: Timestamp,
  $durationSec: Int,
  $result: String,
  $method: String!,
  $notes: String
) @auth(level: USER) {
  visit_insert(data: {
    id: $id,
    shiftId: $shiftId,
    userUid: $userUid,
    outletId: $outletId,
    arrivalAt: $arrivalAt,
    departureAt: $departureAt,
    durationSec: $durationSec,
    result: $result,
    method: $method,
    notes: $notes
  })
}
